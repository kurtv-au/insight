# Insight: nginx behind the ALB. Installed to /etc/nginx/conf.d/insight.conf with
# __DOMAIN__ and __VPC_CIDR__ replaced (docs/DEPLOYMENT.md "nginx").
#
# TLS ends at the ALB, which forwards plain HTTP to port 80 here. nginx serves
# the compiled client assets straight from the active release, so Node only
# renders pages and answers /api; Node listens on 127.0.0.1 only.

# What the ALB said the client used. A request that didn't come through the ALB
# (the deploy's own health check sends the header itself) falls back to ours.
map $http_x_forwarded_proto $insight_forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    # default_server: the ALB's health checks arrive with the instance's IP as Host
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name __DOMAIN__;

    # The client's address is the last X-Forwarded-For entry the ALB added, not
    # the first: anything left of it was sent by the client and can be forged.
    # The rate limits (server/utils/rateLimit.ts) read the first entry, so the
    # header is replaced with just the real address below.
    set_real_ip_from __VPC_CIDR__;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Served to the browser over the ALB's HTTPS
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/css application/javascript application/json image/svg+xml;

    client_max_body_size 1m;

    # Content-hashed bundles. A tab opened before a deploy still asks for the
    # previous release's chunks, so fall back to `previous` before a 404.
    location /_nuxt/ {
        root /opt/insight/current/.output/public;
        try_files $uri @previous_nuxt;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        access_log off;
    }
    location @previous_nuxt {
        root /opt/insight/previous/.output/public;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        access_log off;
    }

    location /fonts/ {
        root /opt/insight/current/.output/public;
        add_header Cache-Control "public, max-age=2592000" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        access_log off;
    }

    # Call audio: streamed through Node with Range for seeking. Passed straight
    # through rather than spooled to a temp file, so playback starts at once.
    location ~ ^/api/tenants/[^/]+/recordings/[^/]+/audio$ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        # Passkeys take their origin from Host and X-Forwarded-Proto
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $insight_forwarded_proto;
        # Only the real client address (see real_ip above)
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        # Passkeys take their origin from Host and X-Forwarded-Proto
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $insight_forwarded_proto;
        # Only the real client address (see real_ip above)
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        # A busy week of messages can take ~10 s from au-api, which gives up at 55 s
        proxy_read_timeout 120s;
    }
}
